# Environment under test.
# Every key can be overridden with -Dkey=value or with an env var (KEY_IN_UPPER_CASE_WITH_UNDERSCORES),
# e.g. -Dapi.base.url=https://host or API_BASE_URL=https://host.

# Required: scheme + host (+ port), no trailing slash and no /api suffix.
api.base.url=https://testslotegrator.com

# Which HTTP stack executes the Feign-declared calls: feign | restassured
api.transport=feign

# Request/response logging: NONE | BASIC | HEADERS | FULL
api.log.level=BASIC

api.connect.timeout.ms=10000
api.read.timeout.ms=30000

